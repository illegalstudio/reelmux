[package]
name = "reelmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A native MP4 track, metadata, subtitle and artwork editor for Linux"
license = "MIT"
homepage = "https://opensource.nahi.me"
repository = "https://github.com/nahime0/reelmux"
keywords = ["mp4", "metadata", "subtitles", "linux", "gtk"]
categories = ["multimedia::video"]
default-run = "reelmux"

[features]
default = ["gui"]
gui = ["dep:gtk"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_10"], optional = true }
mp4ameta = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
url = "2"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
