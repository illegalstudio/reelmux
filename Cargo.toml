[package]
name = "subler-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A Linux MP4 track and metadata editor inspired by Subler"
license = "GPL-2.0-only"
default-run = "subler-linux"

[features]
default = ["gui"]
gui = ["dep:gtk"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_10"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
