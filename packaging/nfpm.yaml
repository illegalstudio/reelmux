name: reelmux
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: "1"
section: video
priority: optional
maintainer: ReelMux contributors <nahime0@users.noreply.github.com>
description: Edit MP4 tracks, subtitles, metadata and artwork on Linux
vendor: ReelMux
homepage: https://opensource.nahi.me
license: GPL-2.0-only

contents:
  - src: ./dist/.stage/reelmux
    dst: /usr/bin/reelmux
    file_info:
      mode: 0755
  - src: ./data/io.github.nahime0.ReelMux.desktop
    dst: /usr/share/applications/io.github.nahime0.ReelMux.desktop
  - src: ./data/io.github.nahime0.ReelMux.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.nahime0.ReelMux.svg
  - src: ./data/io.github.nahime0.ReelMux.metainfo.xml
    dst: /usr/share/metainfo/io.github.nahime0.ReelMux.metainfo.xml
  - src: ./LICENSE
    dst: /usr/share/doc/reelmux/LICENSE
  - src: ./README.md
    dst: /usr/share/doc/reelmux/README.md
  - src: ./THIRD_PARTY.md
    dst: /usr/share/doc/reelmux/THIRD_PARTY.md

recommends:
  - desktop-file-utils

overrides:
  deb:
    depends:
      - ffmpeg
      - libgtk-4-1 (>= 4.10)
      - libgcc-s1
  rpm:
    depends:
      - ffmpeg
      - gtk4
  archlinux:
    depends:
      - ffmpeg
      - gtk4
