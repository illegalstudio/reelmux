name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check and build Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            nfpm_arch: x86_64
            nfpm_sha256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
          - runner: ubuntu-24.04-arm
            arch: arm64
            nfpm_arch: arm64
            nfpm_sha256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag and main
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag $TAG_NAME must use vMAJOR.MINOR.PATCH"
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::Tag $TAG_NAME is not reachable from main"
            exit 1
          fi

          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            desktop-file-utils \
            ffmpeg \
            appstream \
            file \
            libgtk-4-dev \
            librsvg2-dev \
            patch \
            patchelf \
            pkg-config \
            rpm \
            zstd

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Verify manifest version
        run: |
          set -euo pipefail
          manifest_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [[ "$manifest_version" != "$VERSION" ]]; then
            echo "::error::Tag version $VERSION does not match Cargo.toml version $manifest_version"
            exit 1
          fi

      - name: Check
        run: make check

      - name: Install nFPM
        env:
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
        run: |
          set -euo pipefail
          archive="nfpm_2.47.0_Linux_${NFPM_ARCH}.tar.gz"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/${archive}" \
            -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$NFPM_SHA256" "$RUNNER_TEMP/$archive" \
            | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/nfpm"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/nfpm" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"

      - name: Build packages
        env:
          ARCH: ${{ matrix.arch }}
        run: make packages VERSION="$VERSION" ARCH="$ARCH"

      - name: Verify packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          expected="reelmux $VERSION"
          actual="$(target/release/reelmux --version)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Expected '$expected', got '$actual'"
            exit 1
          fi

          case "$ARCH" in
            amd64)
              deb_arch=amd64
              rpm_arch=x86_64
              archlinux_arch=x86_64
              ;;
            arm64)
              deb_arch=arm64
              rpm_arch=aarch64
              archlinux_arch=aarch64
              ;;
          esac

          desktop-file-validate data/io.github.nahime0.ReelMux.desktop
          appstreamcli validate --no-net data/io.github.nahime0.ReelMux.metainfo.xml
          tar -tzf "dist/reelmux_${VERSION}_linux_${ARCH}.tar.gz" >/dev/null
          dpkg-deb --info "dist/reelmux_${VERSION}_linux_${ARCH}.deb" >/dev/null
          dpkg-deb --contents "dist/reelmux_${VERSION}_linux_${ARCH}.deb" >/dev/null
          test "$(dpkg-deb -f "dist/reelmux_${VERSION}_linux_${ARCH}.deb" Architecture)" = "$deb_arch"
          rpm -qip "dist/reelmux_${VERSION}_linux_${ARCH}.rpm" >/dev/null
          rpm -qpR "dist/reelmux_${VERSION}_linux_${ARCH}.rpm" >/dev/null
          test "$(rpm -qp --qf '%{ARCH}' "dist/reelmux_${VERSION}_linux_${ARCH}.rpm")" = "$rpm_arch"
          archlinux_package="dist/reelmux-${VERSION}-1-${archlinux_arch}.pkg.tar.zst"
          tar -tf "$archlinux_package" >/dev/null
          tar -xOf "$archlinux_package" .PKGINFO \
            | grep -Fx "arch = $archlinux_arch"
          APPIMAGE_EXTRACT_AND_RUN=1 \
            "dist/reelmux_${VERSION}_linux_${ARCH}.AppImage" --version \
            | grep -Fx "$expected"

      - name: Checksums
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            amd64) archlinux_arch=x86_64 ;;
            arm64) archlinux_arch=aarch64 ;;
          esac
          cd dist
          sha256sum "reelmux_${VERSION}_linux_${ARCH}.tar.gz" \
            "reelmux_${VERSION}_linux_${ARCH}.deb" \
            "reelmux_${VERSION}_linux_${ARCH}.rpm" \
            "reelmux-${VERSION}-1-${archlinux_arch}.pkg.tar.zst" \
            "reelmux_${VERSION}_linux_${ARCH}.AppImage" \
            > "reelmux_${VERSION}_linux_${ARCH}_checksums.txt"
          cat "reelmux_${VERSION}_linux_${ARCH}_checksums.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: reelmux-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: reelmux-${{ github.ref_name }}-linux-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "ReelMux $GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --fail-on-no-commits
          fi

  notify-pacman:
    name: Publish to Illegal Studio pacman
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mint Illegal Studio Bot token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.ILLEGAL_BOT_APP_ID }}
          private-key: ${{ secrets.ILLEGAL_BOT_PRIVATE_KEY }}
          owner: illegalstudio
          repositories: pacman

      - name: Notify pacman repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api repos/illegalstudio/pacman/dispatches \
            -f event_type=publish \
            -f "client_payload[repo]=$GITHUB_REPOSITORY"
